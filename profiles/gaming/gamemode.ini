; UmaOS GameMode configuration (deployed by the Gaming profile)
; See gamemoded(8) / example: /usr/share/doc/gamemode/gamemode.ini

[general]
; Renice game processes for smoother frame pacing
renice=10
; Keep the soft realtime scheduling GameMode negotiates by default
softrealtime=auto
; Use the performance CPU governor while a game is running
desiredgov=performance

[gpu]
; GPU optimisations are opt-in and vendor-specific; leave disabled by default
apply_gpu_optimisations=0

[custom]
; Notify when GameMode activates/deactivates
start=notify-send "GameMode started"
end=notify-send "GameMode ended"
