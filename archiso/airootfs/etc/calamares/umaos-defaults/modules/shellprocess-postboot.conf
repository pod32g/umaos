---
dontChroot: false
timeout: 120
verbose: true

script:
  - "/usr/local/bin/umao-finalize-installed-customization"
  # The leading "-" (failure-tolerant) must match the live modules/ copy:
  # umao-sync-calamares-config copies these defaults OVER /etc/calamares before
  # every install, so without it a nonzero exit here fails the whole install.
  - "-/usr/local/bin/umao-fix-boot-root-cmdline"
  - "-/usr/local/bin/umao-apply-grub-branding"

i18n:
  name: "UmaOS post-install setup"
