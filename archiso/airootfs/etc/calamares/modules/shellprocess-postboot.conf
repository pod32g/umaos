---
dontChroot: false
# 900, not 120: this step runs umao-finalize-installed-customization, which
# may rebuild the initramfs (mkinitcpio -P) after adding the plymouth hook.
# That routinely exceeds 120s on slow hardware, and Calamares then kills the
# post-install step part-way through.
timeout: 900
verbose: true

script:
  - "/usr/local/bin/umao-finalize-installed-customization"
  - "-/usr/local/bin/umao-fix-boot-root-cmdline"
  - "-/usr/local/bin/umao-apply-grub-branding"

i18n:
  name: "UmaOS post-install setup"
